# Managed by WesPerez/Sub-Store (mine). Include inside the existing TLS server.
location = /substore {
    access_log off;
    return 302 /substore/;
}

# Public downloads use Sub-Store's native scoped, revocable share tokens.
location ^~ /substore/share/ {
    auth_basic off;
    if ($request_method != GET) { return 405; }
    access_log off;
    error_log /var/log/sub-store/nginx-error.log warn;
    proxy_pass http://127.0.0.1:13001/share/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /substore/api { access_log off; return 404; }
location ^~ /substore/api/ { access_log off; return 404; }
location = /substore/download { access_log off; return 404; }
location ^~ /substore/download/ { access_log off; return 404; }

location ^~ /substore/ {
    auth_basic "Sub-Store";
    auth_basic_user_file /etc/sub-store/htpasswd;
    access_log off;
    error_log /var/log/sub-store/nginx-error.log warn;
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:13001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
